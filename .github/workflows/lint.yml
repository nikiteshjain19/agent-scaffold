name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only: the job checks files and writes nothing back.
permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, never to a tag: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npm run lint
